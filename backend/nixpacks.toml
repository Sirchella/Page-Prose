[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py collectstatic --no-input"]

[start]
cmd = "python manage.py migrate --no-input && python manage.py createsuperuser --no-input || true && gunicorn page_and_prose.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
